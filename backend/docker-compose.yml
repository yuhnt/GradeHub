# Development database (and pgAdmin) for `npm run dev`. The full stack
# lives in ../docker-compose.yml.
#
# The project name is pinned so the containers and volumes keep the names
# they had when this file sat at the repository root (task-grading-hub_pgdata).
name: task-grading-hub

services:
  postgres:
    image: postgres:16-alpine
    container_name: taskgrade_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: taskgrade_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin:/root/.pgadmin

volumes:
  pgdata:
  pgadmin:
